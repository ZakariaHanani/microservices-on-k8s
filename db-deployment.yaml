apiVersion: apps/v1
kind: Deployment
metadata: 
  name: db-deployment
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: db
  template: 
    metadata:
      name: db-pod
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine 
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRESS_PASSWORD
              value: postgres
          ports:
            - containerPort: 5432
              name: postgresPort
              
